<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChoreoLayer Space View</title>
<style>html,body{margin:0;height:100%;background:#08050e;color:white;font:18px system-ui}body{display:grid;place-items:center}#grid{width:min(90vw,90vh);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;outline:3px solid #ffffff99}.cell{border-radius:12%;background:#161020}#status{position:fixed;top:12px;left:18px;color:#bfb1cc;font-size:14px}</style>
<div id="status">Connecting · camera space distribution</div><div id="grid"></div><script>
const grid=document.getElementById('grid'),status=document.getElementById('status');for(let i=0;i<64;i++){const el=document.createElement('div');el.className='cell';grid.appendChild(el)}
let timer; function clear(){for(const el of grid.children)el.style.background='#161020'}
function connect(){const room=location.pathname.split('/').pop(),socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/projection/ws/${room}/view`);socket.onopen=()=>status.textContent='Waiting for a session';socket.onmessage=e=>{const data=JSON.parse(e.data);clearTimeout(timer);if(!data.active||data.cells.length!==64){clear();status.textContent='Waiting for camera analysis';return}data.cells.forEach((v,i)=>grid.children[i].style.background=`rgba(226,56,236,${0.08+0.92*Math.sqrt(v)})`);status.textContent=data.calibrated?'Foot positions · calibrated floor area':'Foot positions · camera view, not calibrated';timer=setTimeout(()=>{clear();status.textContent='Waiting for connection'},3000)};socket.onclose=()=>{clear();status.textContent='Disconnected · reconnecting';setTimeout(connect,2000)}}connect();
</script></html>
