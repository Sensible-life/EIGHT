<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eight · Creative display</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Design values (every value explained: docs/DISPLAY_DESIGN.md) ======================================
   Change a value here, save, and reload the page (no server restart). Sizes and positions are px of the
   1280×720 design frame, as read in Figma; the page scales them to the screen. Colors are hex (#rrggbbaa for
   transparency). */
:root{
  --font:Manrope,Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* background: a glow from the middle out to the edges */
  --bg-center:#282244;--bg-inner:#221d3d;--bg-outer:#1e1936;--bg-edge:#1a1730;
  /* the 8: each limb's corner (arms on top, legs below, the dancer's left on the left) is pink when that limb moved
     a lot lately and blue when it barely moved; an even share (25 %) is the middle color, and a share this
     far above or below it (0.15 = 40 % or 10 %) is fully pink or blue. While nobody is tracked: pink on top, blue below. */
  --eight-used:#cdacd9;--eight-middle:#8e88d8;--eight-unused:#4c61d5;--eight-full-at:.15;
  /* how quickly the colors follow the dancer: --eight-now mixes the last 4 s (1) with the last 30 s (0), so higher is
     faster but jumpier; --eight-fade is how long (seconds) one color takes to turn into the next */
  --eight-now:.7;--eight-fade:.6;
  /* its shadow, and how faint it is while nobody is tracked */
  --eight-shadow-color:#8f8ca699;--eight-shadow-y:4;--eight-shadow-blur:4;
  --eight-idle-opacity:.5;
  /* labels (L): text size and color of the part name, the movement, the details, and "less used" */
  --label-name-size:22;--label-name-color:#cdc6ec;
  --label-kind-size:46;--label-kind-color:#ffffff;--label-kind-hold-color:#cfc9ea;--label-kind-unseen-color:#8f89b3;
  --label-detail-size:20;--label-detail-color:#ddd7f6;
  --label-lack-size:20;--label-lack-color:#ffb3c7;
  --label-line-color:#cfc9ecb3;--label-line-width:1.4;--label-dot-color:#f1edff;--label-dot-size:3.5;
  /* label positions: the dot on the 8 (x y), then where the line bends (x y); the text sits on the bent line */
  --label-arm-l:513 178 420 124;--label-arm-r:766 178 860 124;--label-torso:705 352 880 352;
  --label-leg-l:497 560 405 624;--label-leg-r:787 556 880 624;
  /* text lines (y of each baseline): arms name / movement / details; legs the same; torso adds space and less used */
  --label-rows-arms:62 110 152;--label-rows-legs:564 610 652;--label-rows-torso:292 338 380 408 436;
  /* the character: where it stands (center x, feet y), its width, colors and glow */
  --buddy-x:331;--buddy-y:517;--buddy-width:46;
  --buddy-top:#c2cdfb;--buddy-middle:#cbcdfa;--buddy-bottom:#e4c6f3;--buddy-glow:#e9e4ff80;
  /* before it asks it circles the 8: orbit center x y, radius x y, tilt (degrees), seconds per turn; it starts to
     show when the guide is this far (0..1) towards asking, and is clearest just before it asks */
  --orbit:640 380 330 74 -10 7;--orbit-from:.35;
  /* its bubble: gap above the character, text, width, padding, colors and tail */
  --bubble-gap:31;--bubble-font-size:19;--bubble-max-width:282;--bubble-padding-y:14;--bubble-padding-x:28;
  --bubble-color-1:#aaa6d6;--bubble-color-2:#a2b2de;--bubble-color-3:#c6a3cf;--bubble-text-color:#ffffff;
  --bubble-tail-width:18;--bubble-tail-height:12; /* the tail shares the bubble's gradient */
  /* the "…" bubble while it asks: size, its three dots, and the white badge */
  --ask-width:92;--ask-height:40;--ask-dot-size:9;--ask-badge-size:16;
  /* notices (stand still, step into view, camera problems): distance from the top, text sizes, background */
  --notice-y:12;--notice-font-size:24;--notice-sub-size:14;--notice-bg:#2a2450dd;
  /* controls bar and debug view */
  --ink:#f7f4ff;--muted:#bcb5dc;--line:#ffffff22;--panel:#1f1a38f2;
  --px:calc(100cqw / 1280); /* one px of the design frame, on screen */
}
/* ========================================================================================================= */
:root{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{overflow:hidden;display:grid;place-items:center;color:var(--ink);font-family:var(--font);background:var(--bg-edge) radial-gradient(circle at 50% 46%,var(--bg-center) 0,var(--bg-inner) 15vmax,var(--bg-outer) 27vmax,var(--bg-edge) 44vmax) no-repeat}
body.idle{cursor:none}
/* the scene is drawn on the 1280×720 frame and scales with the window */
.stage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;container-type:inline-size}
.scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.eight{filter:drop-shadow(0 calc(var(--eight-shadow-y) * var(--px)) calc(var(--eight-shadow-blur) * var(--px)) var(--eight-shadow-color));transition:opacity .8s ease}.stage.offline .eight{opacity:var(--eight-idle-opacity)}
.eight stop{transition:stop-color calc(var(--eight-fade) * 1s) ease}
/* the 8's labels: each part's name and what it is doing, big enough to read from where the dancer stands */
.labels{opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}.labels.on{opacity:1;visibility:visible}
.labels .name{font-size:calc(var(--label-name-size) * 1px);font-weight:600;fill:var(--label-name-color);letter-spacing:.01em}
.labels .kind{font-size:calc(var(--label-kind-size) * 1px);font-weight:800;fill:var(--label-kind-color);letter-spacing:-.01em}
.labels .detail,.labels .space{font-size:calc(var(--label-detail-size) * 1px);font-weight:600;fill:var(--label-detail-color)}
.labels .lack{font-size:calc(var(--label-lack-size) * 1px);font-weight:700;fill:var(--label-lack-color)}
.labels .leader{fill:none;stroke:var(--label-line-color);stroke-width:var(--label-line-width)}.labels .dot{fill:var(--label-dot-color)}
.part.unseen .kind{fill:var(--label-kind-unseen-color)}.part.hold .kind{fill:var(--label-kind-hold-color)}.part.lacking .name{fill:var(--label-lack-color)}
.part.lacking .dot{fill:var(--label-lack-color);transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.9);opacity:.6}}
/* the character and its bubble, left of the 8 */
.guide{position:absolute;left:calc(var(--buddy-x) / 1280 * 100%);bottom:calc((720 - var(--buddy-y)) / 720 * 100%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--bubble-gap) * var(--px));opacity:0;transform:translate(-50%,1.2cqw);transition:opacity .45s ease,transform .45s ease;pointer-events:none}
.guide.show{opacity:1;transform:translate(-50%,0)}
/* before it asks: the character alone, circling the 8 (its place on the orbit is set per frame), clearer as the question nears */
.guide.orbit{transition:opacity .8s ease;z-index:2}.guide.orbit.behind{z-index:0}.guide.orbit .bubble{visibility:hidden}
/* then it glides to its spot, and the bubble pops up once it is there */
.guide.land{transition:opacity .45s ease,transform .7s cubic-bezier(.3,.7,.3,1)}.guide.land .bubble{animation:pop .35s ease .55s both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(.6cqw)}to{opacity:1;transform:none}}
.scene{z-index:1}.guide{z-index:2}.notice{z-index:3}
.bubble{position:relative;display:grid;place-items:center;min-height:calc(var(--ask-height) * var(--px));max-width:calc(var(--bubble-max-width) * var(--px));padding:calc(var(--bubble-padding-y) * var(--px)) calc(var(--bubble-padding-x) * var(--px));isolation:isolate;color:var(--bubble-text-color);font-size:calc(var(--bubble-font-size) * var(--px));font-weight:600;line-height:1.3;text-align:center;text-wrap:balance;text-shadow:0 1px .5cqw #5a4b8a66}
/* the bubble and its tail are one outline (drawn to the bubble's size), so the gradient and the shadow run through both */
.bubble-bg{position:absolute;left:0;top:0;z-index:-1;overflow:visible;pointer-events:none;filter:drop-shadow(0 .5cqw 1cqw #0d0a2066)}
.bubble.ask{width:calc(var(--ask-width) * var(--px));height:calc(var(--ask-height) * var(--px));padding:0}.bubble.ask .text,.bubble:not(.ask) .dots,.bubble:not(.ask) .badge{display:none}
.dots{display:flex;gap:calc(var(--ask-dot-size) * var(--px))}.dots i{width:calc(var(--ask-dot-size) * var(--px));height:calc(var(--ask-dot-size) * var(--px));border-radius:50%;background:#fff;animation:typing 1.2s ease-in-out infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:none}30%{transform:translateY(-.3cqw)}}
.dots.holding i{animation:none;opacity:.3;transition:opacity .2s,transform .2s}.dots.holding i.on{opacity:1;transform:scale(1.35)} /* one dot per second of the O */
.badge{position:absolute;right:-.35cqw;top:-.45cqw;width:calc(var(--ask-badge-size) * var(--px));height:calc(var(--ask-badge-size) * var(--px));border-radius:50%;background:#fff;box-shadow:0 0 .8cqw #fff9}
.buddy{width:calc(var(--buddy-width) * var(--px));height:auto;overflow:visible;filter:drop-shadow(0 .4cqw .8cqw var(--buddy-glow));animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-.35cqw)}}
/* notices: calibration, step into view, camera problems */
.notice{position:absolute;left:50%;top:calc(var(--notice-y) / 720 * 100%);transform:translateX(-50%);max-width:34cqw;padding:.8cqw 2cqw;border-radius:1.8cqw;background:var(--notice-bg);border:1px solid #ffffff26;box-shadow:0 1cqw 3cqw #0007;text-align:center;font-size:calc(var(--notice-font-size) * var(--px));font-weight:700;letter-spacing:-.01em;line-height:1.2}
.notice small{display:block;margin-top:.4cqw;font-size:calc(var(--notice-sub-size) * var(--px));font-weight:500;color:var(--muted);letter-spacing:0}
.nbar{height:.4cqw;border-radius:1cqw;background:#ffffff1f;margin-top:.8cqw;overflow:hidden}.nbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--eight-used),var(--eight-unused));transition:width .2s}
/* controls: appear when the mouse moves, hide after a moment */
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;max-width:calc(100vw - 32px);padding:6px;border-radius:24px;background:#211c3ce6;border:1px solid var(--line);box-shadow:0 10px 30px #0007;font-size:13px;transition:opacity .4s}
body.idle .bar{opacity:0;pointer-events:none}
/* the webcam is recording for the phone: always shown, even when the controls hide */
.rec{position:fixed;top:14px;left:16px;z-index:9;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;color:#ff687e;border:1px solid #ff687e;background:#451c2cee;max-width:calc(100vw - 32px)}
.status{display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--muted);white-space:nowrap}.sdot{width:8px;height:8px;border-radius:50%;background:#8f88b5}.sdot.live{background:#b9f0c4;box-shadow:0 0 10px #b9f0c4}
.chip{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#ffffff0d;color:var(--ink);border-radius:999px;padding:7px 13px;text-decoration:none}.chip[aria-pressed=true]{background:#b7a6f02e;border-color:#b7a6f066}.chip.primary{background:#e9e4ff;color:#221c3d;border-color:transparent}
.chip:focus-visible,.drag-handle:focus-visible{outline:2px solid #cbb9ff;outline-offset:2px}
.hidden{display:none!important}
/* debug view */
.debug{position:fixed;right:16px;top:16px;z-index:8;width:min(420px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid #ffffff26;border-radius:16px;padding:12px 14px;font-size:12.5px;line-height:1.5;box-shadow:0 18px 50px #000a;transition:transform .25s}
.debug.closed{transform:translateX(calc(100vw + 40px));pointer-events:none}.debug.dragging{transition:none;user-select:none}
.drag-handle{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:grab;touch-action:none;margin:-12px -14px 0;padding:10px 14px 8px;border-radius:16px 16px 0 0}.drag-handle:active{cursor:grabbing}
.micro{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#cdb8f0;font-weight:700}.info{font-size:11.5px;color:var(--muted)}
.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:8px}.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.debug dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0}.debug dt{color:var(--muted)}.debug dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-word}
.debug input{font:inherit;background:#ffffff12;border:1px solid var(--line);border-radius:8px;color:inherit;padding:4px 8px}.debug input[type=number]{width:80px}.debug a{color:#d9c8ff}
.debug .link{border:0;background:none;padding:0;font:inherit;color:#d9c8ff;cursor:pointer;text-decoration:underline}
@media(prefers-reduced-motion:reduce){.dots i,.buddy,.part.lacking .dot{animation:none}.guide,.labels,.eight,.debug,.bar{transition:none}}
</style>

    pos = { x: Math.max(8, Math.min(pos.x, innerWidth - w - 8)), y: Math.max(8, Math.min(pos.y, innerHeight - 128)) };
    // the panel scrolls inside whatever room is left below its top edge, so nothing ends up off screen
    Object.assign(panel.style, { left: `${pos.x}px`, top: `${pos.y}px`, right: 'auto', bottom: 'auto', maxHeight: `${innerHeight - pos.y - 8}px` });
  };
  const save = () => { try { localStorage.setItem('eight.debug.pos', JSON.stringify(pos)); } catch {} };
  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const r = panel.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    handle.setPointerCapture(e.pointerId); panel.classList.add('dragging');
  });
  handle.addEventListener('pointermove', e => { if (drag) { pos = { x: e.clientX - drag.dx, y: e.clientY - drag.dy }; place(); } });
  const drop = () => { if (!drag) return; drag = null; panel.classList.remove('dragging'); save(); };
  handle.addEventListener('pointerup', drop);
  handle.addEventListener('pointercancel', drop);
  handle.addEventListener('dblclick', () => { pos = null; place(); save(); });
  handle.addEventListener('keydown', e => {
    const step = e.shiftKey ? 80 : 20, move = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
    if (!move) return;
    e.preventDefault(); e.stopPropagation();
    const r = panel.getBoundingClientRect();
    pos = { x: r.left + move[0], y: r.top + move[1] }; place(); save();
  });
  addEventListener('resize', place);
  place();
}
$('debug-note').classList.toggle('hidden', webcam);
$('debug-note').textContent = isDemo ? 'A scripted dancer instead of a camera: the wireframe below is what goes into the same tracking code as the webcam.' : 'Video stays on the phone. Check the phone\'s camera tab.';
$('debug-webcam').classList.toggle('hidden', !webcam && !isDemo);
$('debug-inputs').classList.toggle('hidden', isDemo);
$('video').classList.toggle('hidden', isDemo);
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'd') setDebug(!debugOpen);
  else if (k === 'l') setLabels(!labelsOn);
  else if (k === 'y') answer('accept');
  else if (k === 'n') answer('dismiss');
});
const fill = (dl, rows) => {
  dl.textContent = '';
  for (const [k, v] of rows) { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
};
const pct = x => `${Math.round(100 * x)}%`;
function roomDebug(data) { // what the room carries, in every mode
  const a = data?.agent, t = a?.timers, p = a?.proposal, b = data?.body, m = data?.movement, s = data?.space;
  fill($('debug-room'), [
    ['Status', `${$('status').textContent}${$('mode').textContent}${data ? ` · ${data.calibrated ? 'floor calibrated' : 'camera view'}` : ''}`],
    ['Arms / legs', b ? `${pct(b.upper)} / ${pct(b.lower)} (30 s)` : '—'],
    ['Limbs (8 colors)', b?.limbs ? Object.entries(b.limbs).map(([k, v]) => `${k} ${pct(v)}${b.limbsNow ? ` (now ${pct(b.limbsNow[k])})` : ''}`).join(' · ') : '—'],
    ['Less used', b ? b.underused.join(' · ') || 'none' : '—'],
    ['Movement', m ? [m.speed, m.size, m.direction, m.texture, m.lead && `lead ${m.lead}`, m.timing].filter(Boolean).join(' · ') : '—'],
    ['Space', s ? `${s.zone} · ${s.level} · ${s.depth} · weight ${s.weight} · ${s.width} wide` : '—'],
    ['Guide', a ? `${a.state}${p ? ` · ${p.kind} ${p.target}` : ''}` : '—'],
    ['Idea', p?.kind === 'suggestion' ? `${p.title} — ${p.detail}` : '—'],
    ['Why', p?.reason || '—'],
    ['Timers', t ? `warm-up ${t.warmup}s · cooldown ${t.cooldown}s${t.answer != null ? ` · answer ${t.answer}s` : ''}` : '—'],
    ['Holding', t ? Object.entries(t.holding).map(([k, v]) => `${k} ${v}s`).join(' · ') || 'none' : '—'],
  ]);
}

let sticky = false, noticeKey = null, noticeProgress = null; // sticky: a camera problem or a taken session stays until the input changes
const notice = (key, progress = null) => {
  if (key === noticeKey && progress === noticeProgress) return;
  noticeKey = key; noticeProgress = progress;
  const [text, sub] = key ? T().notices[key] : ['', ''];
  $('notice').classList.toggle('hidden', !key); $('notice-text').textContent = text; $('notice-sub').textContent = sub;
  $('notice-bar').classList.toggle('hidden', progress === null); if (progress !== null) $('notice-fill').style.width = `${Math.round(100 * progress)}%`;
};

// ---- language: EN (default) / KO, remembered per browser ----
function applyLang() {
  document.documentElement.lang = lang;
  const w = T();
  $('privacy').textContent = webcam || isDemo ? w.privacyWebcam : w.privacyPhone;
  $('moves-link').textContent = w.moves;
  $('lang').textContent = lang === 'en' ? 'EN / KO' : 'KO / EN'; $('lang').setAttribute('aria-pressed', String(lang === 'ko'));
  $('labels-toggle').textContent = w.labels; $('debug-toggle').textContent = w.debug; $('demo-link').textContent = w.demo;
  $('status').textContent = w.status[statusKey] ?? statusKey; setToggle();
  redrawLabels(); showGuide(lastData?.agent);
  if (noticeKey) { const key = noticeKey; noticeKey = null; notice(key, noticeProgress); }
}
$('lang').onclick = () => { lang = lang === 'en' ? 'ko' : 'en'; try { localStorage.setItem('eight.lang', lang); } catch {} applyLang(); };
$('mode').textContent = ` · ${modeLabel}`;
applyLang();
setLabels(recall('eight.labels'));
setDebug(recall('eight.debug'));
document.fonts?.ready.then(redrawLabels); // underlines follow the text once the font is in
connect();
if (webcam || isDemo) startReader();

// ---- reading the dancer on this computer: the webcam, or (demo) a scripted dancer; the same tracking code as the phone ----
async function startReader() {
  const lib = await import('/static/tracking.js'), { DisplayTracker, webPoseEvent, SKELETON_EDGES } = lib;
  const VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';
  const tracker = new DisplayTracker(), video = $('video'), overlay = $('overlay');
  $('room-link').href = `/display/${room}`; $('room-link').textContent = `${location.origin}/display/${room}`;

  // the page's reading goes to the room: publish (alone) or camera (in a phone session)
  let sender = null, frame = null, phone = null, phoneAt = 0;
  // Recording for the phone (in a phone session): the phone sends start / stop through the room, this page records the
  // webcam and uploads the take; the server converts it and the phone can save it.
  let recorder = null, chunks = [], recordingTake = null, captureState = 'Ready', captureStarted = 0, recordingLimit = null;
  const updateCapture = state => {
    captureState = state;
    const badge = $('record-indicator');
    badge.classList.toggle('hidden', state === 'Ready');
    badge.textContent = state;
  };
  setInterval(() => {
    if (recorder?.state === 'recording') updateCapture(`● REC · ${Math.floor((performance.now() - captureStarted) / 1000)}s`);
  }, 250);
  const recordEvent = (state, message) => {
    if (state === 'started') { captureStarted = performance.now(); updateCapture('● REC · 0s'); }
    else if (state === 'stopped') updateCapture('Transferring video…');
    else if (state === 'saved') updateCapture('Recording ready');
    else if (state === 'error') updateCapture(`Recording error: ${message ?? 'Unknown error'}`);
    if (sender?.readyState === WebSocket.OPEN) sender.send(JSON.stringify({ type: 'record_event', state, take: recordingTake, message }));
  };
  const recordCommand = async p => {
    try {
      if (p.action === 'start') {
        recordingTake = p.take;
        if (!camera || !video.srcObject || recorder?.state === 'recording') throw new Error('Webcam is not ready.');
        chunks = [];
        const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
        recorder = new MediaRecorder(video.srcObject, mimeType ? { mimeType } : undefined);
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onerror = () => recordEvent('error', 'Webcam recording failed.');
        recorder.onstart = () => { recordEvent('started'); recordingLimit = setTimeout(() => { if (recorder?.state === 'recording') recorder.stop(); }, 60000); };
        recorder.onstop = async () => {
          if (recordingLimit) clearTimeout(recordingLimit);
          try {
            recordEvent('stopped');
            const response = await fetch(`/projection/recordings/${room}/${recordingTake}`, { method: 'POST', body: new Blob(chunks, { type: recorder.mimeType }) });
            if (!response.ok) throw new Error('Could not transfer webcam recording.');
            recordEvent('saved');
          } catch (e) { recordEvent('error', e.message); }
          finally { recorder = null; chunks = []; }
        };
        recorder.start(1000);
      } else if (p.action === 'stop' && recorder?.state === 'recording' && p.take === recordingTake) recorder.stop();
    } catch (e) { recordEvent('error', e.message); }
  };
  const isAsking = () => proposalKind === 'help';
  const openSender = () => {
    sender = new WebSocket(`${wsBase}/${joined ? 'camera' : 'publish'}${isDemo ? '?demo=1' : ''}`); // a demo room asks sooner
    sender.onmessage = e => { try { const data = JSON.parse(e.data), p = data.phone; if (p) { phone = p; phoneAt = performance.now(); } if (data.type === 'record_command') void recordCommand(data); } catch {} };
    sender.onclose = e => {
      if (recorder?.state === 'recording') { recorder.stop(); updateCapture('Recording interrupted · connection lost'); }
      if (e.code === 1008 && joined) { sticky = true; notice('taken'); return; }
      setTimeout(openSender, 2000);
    };
  };
  openSender();
  setInterval(() => { if (sender?.readyState === WebSocket.OPEN && frame) sender.send(JSON.stringify(frame.packet)); }, 250);
  if (!joined && !isDemo) setInterval(async () => { // phone sessions on this server without a camera: one click joins
    try {
      const { rooms } = await (await fetch('/movement/rooms')).json(), box = $('phone-line');
      box.textContent = rooms.length ? 'Phone session found: ' : '';
      for (const r of rooms) { if (!ROOM_RE.test(r)) continue; const a = document.createElement('a'); a.href = `/display?room=${r}`; a.textContent = `join ${r.slice(0, 4)}… as its camera `; box.appendChild(a); }
    } catch {}
  }, 3000);

  let beat = null, beatFrom = 0;
  $('bpm').oninput = e => { const bpm = Number(e.target.value); beat = bpm >= 40 && bpm <= 240 ? 60 / bpm : null; beatFrom = performance.now(); };
  const musicNow = tMs => (phone?.playing && phone.position !== null ? phone.position + (tMs - phoneAt) / 1000 : beat ? (tMs - beatFrom) / 1000 : null);
  const mirror = on => { for (const el of [video, overlay]) el.style.transform = on ? 'scaleX(-1)' : 'none'; };

  let camera = false, delegate = '—', frames = 0, fps = 0, fpsAt = performance.now();
  let inputLine = () => `${camera ? 'webcam' : video.src ? 'video file' : 'none'} · ${fps} fps · ${delegate}`;
  /** One frame of the dancer through the tracker; then the O answer, the notices and the debug view. */
  const read = (event, music) => {
    frame = tracker.step(event, { ...music, asking: isAsking() });
    if (frame.answer.yes) answer('accept');
    setHold(isAsking() ? frame.answer.progress : 0);
    if (!sticky) {
      const s = frame.status?.state;
      if (s === 'calibrating' && frame.pose) notice('standStill', Math.round(20 * frame.status.progress) / 20);
      else if (!frame.pose && s !== 'tracking') notice('stepIn');
      else notice(null);
    }
    frames++;
    if (event.tMs - fpsAt >= 1000) { fps = Math.round(frames * 1000 / (event.tMs - fpsAt)); frames = 0; fpsAt = event.tMs; }
    if (debugOpen) drawDebug(frame);
  };
  if (isDemo) { dance(); return; }

  // The demo: a scripted dancer instead of the camera (app/src/tracking/figures.ts). It stands still to calibrate,
  // dances with the arms only, answers the character with an O, then tries what it suggested. Everything after the
  // figure is the real reading: the same tracker, words, guide and screen as with the webcam.
  function dance() {
    const { demoFigure, figureEvent, BEAT_S, DEMO_TRY_S } = lib, start = performance.now();
    let cue = 'still', since = start, askedAt = null, seq = 0, idea = null, ideaAt = 0;
    const go = (next, now) => { if (next !== cue) { cue = next; since = now; } };
    mirror(true);
    inputLine = () => `scripted dancer · ${cue} · ${fps} fps`;
    setInterval(() => {
      const now = performance.now(), t = (now - since) / 1000, asking = isAsking();
      const offered = proposalKind === 'suggestion' ? lastData?.agent?.proposal?.target : null;
      askedAt = asking ? askedAt ?? now : null;
      if (cue === 'still' && t >= 4) go('dance', now);
      else if (asking && cue !== 'yes' && now - askedAt >= 1500) go('yes', now); // a moment to see the question, then the O
      else if (cue === 'yes' && !asking) { go('dance', now); idea = offered; ideaAt = now + 3000; } // the yes went through: read the idea first
      else if (idea && cue === 'dance' && now >= ideaAt) { go(idea, now); idea = null; } // then try it
      else if (!['still', 'dance', 'yes'].includes(cue) && t >= DEMO_TRY_S) go('dance', now);
      read(figureEvent(now, ++seq, demoFigure(cue, (now - since) / 1000)), { musicT: (now - start) / 1000, beatS: BEAT_S, playing: true });
    }, 1000 / 30);
  }

  const startCamera = async () => {
    try {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) { camera = false; sticky = true; notice('insecureCamera'); return; } // a camera needs localhost or https
      video.removeAttribute('src'); video.loop = false;
      video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      await video.play(); camera = true; mirror(true); tracker.reset(); sticky = false; notice(null);
    } catch (e) {
      camera = false; sticky = true;
      notice(e?.name === 'NotAllowedError' ? 'permission' : 'noCamera');
    }
  };
  $('use-camera').onclick = () => void startCamera();
  $('file').onchange = e => { // a dance video instead of the webcam: same model, same reading; the file stays in this page
    const file = e.target.files?.[0];
    if (!file) return;
    video.srcObject?.getTracks().forEach(t => t.stop());
    video.srcObject = null; video.src = URL.createObjectURL(file); video.loop = true; mirror(false);
    tracker.reset(); sticky = false; notice(null); void video.play();
  };

  let landmarker;
  try {
    notice('loading');
    const { FilesetResolver, PoseLandmarker } = await import(`${VISION}/vision_bundle.mjs`);
    const fileset = await FilesetResolver.forVisionTasks(`${VISION}/wasm`);
    const create = d => PoseLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numPoses: 1 });
    try { landmarker = await create('GPU'); delegate = 'GPU'; } catch { landmarker = await create('CPU'); delegate = 'CPU'; }
    notice(null);
  } catch {
    notice('noModel');
    return;
  }
  await startCamera();

  let last = -1, seq = 0;
  const loop = () => {
    requestAnimationFrame(loop);
    if (video.readyState < 2 || !video.videoWidth || video.currentTime === last) return;
    if (video.currentTime < last) tracker.reset(); // the video looped: start over, calibrate again
    last = video.currentTime;
    const tMs = performance.now(), res = landmarker.detectForVideo(video, tMs), done = performance.now();
    const event = webPoseEvent({ tMs, seq: ++seq, nowMs: done, wallMs: Date.now(), latencyMs: done - tMs, aspect: video.videoWidth / video.videoHeight, image: res.landmarks?.[0], world: res.worldLandmarks?.[0] });
    read(event, { musicT: musicNow(tMs), beatS: beat, playing: joined ? (phone ? phone.playing : true) : true });
  };
  loop();

  function drawDebug(f) {
    // the webcam's picture under its skeleton; the demo's figure alone (3:4, like the scripted frame)
    const [w, h] = isDemo ? [480, 640] : [video.videoWidth, video.videoHeight];
    if (overlay.width !== w || overlay.height !== h) { overlay.width = w; overlay.height = h; }
    const g = overlay.getContext('2d'); g.clearRect(0, 0, w, h);
    if (isDemo) { g.fillStyle = '#120f22'; g.fillRect(0, 0, w, h); }
    if (f.pose) {
      g.lineWidth = Math.max(3, overlay.width / 160); g.lineCap = 'round';
      for (const [a, b] of SKELETON_EDGES) {
        const p = f.pose.lm[a], q = f.pose.lm[b]; if (!p || !q) continue;
        g.strokeStyle = p[2] < 0.5 || q[2] < 0.5 ? '#b7a6f040' : '#b7a6f0';
        g.beginPath(); g.moveTo(p[0] * overlay.width, p[1] * overlay.height); g.lineTo(q[0] * overlay.width, q[1] * overlay.height); g.stroke();
      }
    }
    const seg = f.usage.recent?.segments, lv = f.usage.recent?.level, parts = f.label?.parts ?? {};
    fill($('debug-values'), [
      ['Recording', captureState],
      ['Input', inputLine()],
      ['Tracker', `${f.status?.state ?? '—'}${f.status?.state === 'calibrating' ? ` ${pct(f.status.progress)}` : ''}`],
      ['Parts (30 s)', seg ? Object.entries(seg).map(([k, v]) => `${k} ${pct(v)}`).join(' · ') : '—'],
      ['Unknown', Object.entries(parts).filter(([, p]) => p.kind === null).map(([k]) => k).join(' · ') || 'none'],
      ['Height', lv ? `low ${pct(lv.low)} · mid ${pct(lv.mid)} · high ${pct(lv.high)}` : '—'],
      ['Lacking', f.lacking.join(' · ') || 'none'],
      ['Tried (8 ct)', (f.packet.explored ?? []).join(' · ') || 'none'],
      ['O answer', f.answer.progress > 0 ? pct(f.answer.progress) : isAsking() ? 'waiting for an O' : '—'],
    ]);
  }
}
</script>
